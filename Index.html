<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18162a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leben als RPG">
<title>Leben als RPG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b43f'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* FARBEN & DESIGN: Alle Farben sind als Variablen (Tokens) hier im :root definiert und
   werden im restlichen CSS nur über var(--name) genutzt. Zum Umfärben also HIER ändern.
   Darunter folgen zwei Blöcke, die dieselben Tokens für den Dunkelmodus überschreiben
   (einmal automatisch nach System, einmal für die manuelle Umschaltung per ◐-Knopf).
   --st-* = die fünf Skill-Farben (müssen zu den css-Werten in STATS im Skript passen). */
:root{
  --bg:#f3f2f8; --surface:#ffffff; --surface-2:#eceaf4; --border:#d9d7e6;
  --fg:#1b1930; --muted:#6c6884; --faint:#908ca6;
  --gold:#b67d14; --gold-ink:#7a5205; --gold-bg:rgba(182,125,20,.12); --gold-line:rgba(182,125,20,.35);
  --st-koerper:#d1413b; --st-geist:#2f7fd1; --st-kreativ:#7a4fd0; --st-alltag:#188a68; --st-beziehung:#cf4089;
  --danger:#d1413b;
  --shadow:0 1px 2px rgba(27,25,48,.05),0 8px 24px rgba(27,25,48,.06);
  --r:16px;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,sans-serif;
  --f-mono:"Space Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0e1a; --surface:#18162a; --surface-2:#221f39; --border:#2f2c4a;
  --fg:#ece9f7; --muted:#9a96b6; --faint:#726e92;
  --gold:#f0b43f; --gold-ink:#f7cf7e; --gold-bg:rgba(240,180,63,.14); --gold-line:rgba(240,180,63,.32);
  --st-koerper:#ff6b63; --st-geist:#5aa6ef; --st-kreativ:#a885ff; --st-alltag:#35c89b; --st-beziehung:#ff6fb0;
  --danger:#ff6b63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f0e1a; --surface:#18162a; --surface-2:#221f39; --border:#2f2c4a;
  --fg:#ece9f7; --muted:#9a96b6; --faint:#726e92;
  --gold:#f0b43f; --gold-ink:#f7cf7e; --gold-bg:rgba(240,180,63,.14); --gold-line:rgba(240,180,63,.32);
  --st-koerper:#ff6b63; --st-geist:#5aa6ef; --st-kreativ:#a885ff; --st-alltag:#35c89b; --st-beziehung:#ff6fb0;
  --danger:#ff6b63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:48px}
#fxcanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  border-bottom:1px solid var(--border)}
.header-in{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:16px;background:var(--gold-bg);border:1px solid var(--gold-line)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.hbtns{display:flex;gap:7px;flex:none}
.ibtn{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);height:34px;min-width:34px;padding:0 10px;border-radius:9px;font-size:14px;cursor:pointer;font-family:var(--f-body)}
.ibtn.on{color:var(--gold-ink);background:var(--gold-bg);border-color:var(--gold-line)}
.ibtn:active{transform:scale(.94)}

.hero{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hero-top{display:flex;align-items:center;gap:13px;padding:16px 16px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 10%,transparent),transparent)}
.hero-ava{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--pc) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 40%,transparent)}
.hero-id{min-width:0;flex:1}
.hero-name{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.02em}
.hero-epithet{font-size:12.5px;color:var(--muted);margin-top:2px}
.hero-lvl{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--pc);text-align:right;flex:none}
.hero-lvl b{display:block;font-size:26px;line-height:1}
.hero-lvl span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.xpbar{padding:0 16px 15px}
.xpbar-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.xpbar-row .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.xpbar-row .val{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.track{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 55%,var(--gold)),var(--pc));transition:width .5s cubic-bezier(.3,1,.4,1)}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 12px 14px}
.stat{text-align:center;padding:9px 3px 8px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)}
.stat-ico{font-size:15px}
.stat-lv{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--sc);margin-top:1px}
.stat-nm{font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-mini{height:3px;border-radius:9px;background:color-mix(in srgb,var(--sc) 20%,transparent);margin:5px 4px 0;overflow:hidden}
.stat-mini i{display:block;height:100%;background:var(--sc);border-radius:9px}

.vswitch{display:flex;gap:4px;margin-top:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px}
.vswitch button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:13px;padding:9px;border-radius:9px}
.vswitch button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-h .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}

.quests{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.q.done{background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-color:color-mix(in srgb,var(--sc) 35%,var(--border))}
.q.archived{opacity:.55}
.q.over{border-color:color-mix(in srgb,var(--danger) 55%,var(--border));background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
.q.over .q-name{color:var(--danger)}
.q-ico{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--sc) 14%,transparent)}
.q-body{flex:1;min-width:0}
.q-name{font-weight:600;font-size:14.5px;line-height:1.2}
.q.done .q-name{color:var(--muted)}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:10px;padding:1.5px 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.pill.goal.met{color:var(--sc);border-color:color-mix(in srgb,var(--sc) 45%,transparent);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.pill.cat{color:var(--sc);border-color:color-mix(in srgb,var(--sc) 40%,transparent);background:color-mix(in srgb,var(--sc) 10%,transparent)}
.pill.xp{color:var(--gold-ink);background:var(--gold-bg);border-color:var(--gold-line)}
.streak{display:inline-flex;align-items:center;gap:2px}
.check{appearance:none;border:0;background:transparent;cursor:pointer;flex:none;padding:0}
.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--border);background:var(--surface-2);display:grid;place-items:center;transition:all .16s ease}
.box svg{width:17px;height:17px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:all .18s cubic-bezier(.3,1.5,.5,1)}
.q.done .box{background:var(--sc);border-color:var(--sc)}
.q.done .box svg{opacity:1;transform:scale(1)}
.check:active .box{transform:scale(.88)}
.del{appearance:none;flex:none;width:34px;height:34px;border-radius:9px;cursor:pointer;border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-size:15px}
.del:active{transform:scale(.9)}
.q.editing{border-style:dashed}

.addbtn{width:100%;margin-top:12px;padding:13px;border-radius:13px;cursor:pointer;border:1.5px dashed var(--gold-line);background:var(--gold-bg);color:var(--gold-ink);font-family:var(--f-display);font-weight:800;font-size:14px}
.addbtn:active{transform:scale(.99)}
.form{margin-top:12px;background:var(--surface);border:1px solid var(--gold-line);border-radius:14px;box-shadow:var(--shadow);padding:15px 14px}
.form h3{font-family:var(--f-display);font-weight:800;font-size:16px;margin:0 0 13px}
.frow{margin-bottom:13px}
.flab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 6px}
.finput{width:100%;height:44px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-family:var(--f-body);font-size:15px;padding:0 13px;outline:none}
.finput:focus{border-color:var(--gold)}
.seg{display:flex;gap:5px}
.seg button{flex:1;appearance:none;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);padding:9px 4px;border-radius:10px;font-family:var(--f-body);font-size:12.5px;font-weight:600}
.seg button.on{color:var(--gold-ink);border-color:var(--gold-line);background:var(--gold-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);padding:7px 11px;border-radius:10px;font-family:var(--f-body);font-size:13px;font-weight:600}
.chip.on{color:var(--cc,var(--gold));border-color:var(--cc,var(--gold));background:color-mix(in srgb,var(--cc,var(--gold)) 12%,transparent)}
.estep{display:flex;align-items:center;border:1px solid var(--border);border-radius:11px;overflow:hidden;width:fit-content;background:var(--surface-2)}
.estep button{appearance:none;border:0;background:transparent;color:var(--fg);width:42px;height:42px;font-size:20px;cursor:pointer}
.estep button:active{background:var(--border)}
.estep span{min-width:84px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.xphint{font-family:var(--f-mono);font-size:12px;color:var(--gold-ink);background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:8px 11px;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.fbtns{display:flex;gap:8px}
.fbtn{flex:1;height:46px;border-radius:12px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:14px;border:0}
.fbtn.save{color:#1b1407;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 78%,#000))}
.fbtn.cancel{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.fbtn:active{transform:translateY(1px)}
.fbtn:disabled{opacity:.5}

.weekwrap{margin-top:18px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wd{padding:7px 0 6px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.wd.today{border-color:var(--pc)}
.wd-l{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.wd-n{font-family:var(--f-mono);font-size:12px;font-weight:700;margin-top:2px}
.wd-dot{width:6px;height:6px;border-radius:99px;margin:4px auto 0;background:var(--border)}
.wd.hit .wd-dot{background:var(--pc)}
.wd.hit .wd-n{color:var(--pc)}

.tree{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.branch{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px 14px 15px;border-left:3px solid var(--sc)}
.br-head{display:flex;align-items:center;gap:10px}
.br-ico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--sc) 15%,transparent)}
.br-id{flex:1;min-width:0}
.br-name{font-family:var(--f-display);font-weight:800;font-size:16px}
.br-rank{font-size:12px;color:var(--sc);font-weight:600}
.br-lv{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--sc);flex:none}
.br-track{margin:11px 2px 0;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.br-track i{display:block;height:100%;background:var(--sc);border-radius:9px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.br-xp{font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-top:4px;text-align:right}
.nodes{display:flex;align-items:flex-start;margin-top:13px}
.nodewrap{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.nodewrap::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.nodewrap:first-child::before{display:none}
.nodewrap.on::before{background:var(--sc)}
.node{width:22px;height:22px;border-radius:99px;z-index:1;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--border);font-family:var(--f-mono);font-size:9px;color:var(--faint)}
.nodewrap.on .node{background:var(--sc);border-color:var(--sc);color:#fff}
.nodewrap.cur .node{box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 30%,transparent)}
.node-t{font-size:8.5px;line-height:1.15;margin-top:5px;color:var(--muted);max-width:64px}
.nodewrap.on .node-t{color:var(--fg);font-weight:600}
.tree.g-m .node{clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%);border-radius:0}
.tree.g-m .br-ico{clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%);border-radius:0}
.tree.g-f .node{border-radius:60% 60% 55% 55%/70% 70% 45% 45%}
.tree.g-f .br-ico{border-radius:60% 60% 55% 55%/70% 70% 45% 45%}

.tools{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.tbtn{appearance:none;width:100%;display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-family:var(--f-body);font-size:13.5px;font-weight:600}
.tbtn:active{transform:scale(.99)}
.tbtn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.tbtn small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.tbtn .ti{font-size:17px;flex:none}

.note{margin-top:16px;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.4;background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--gold-ink)}
.empty{padding:16px;border:1.5px dashed var(--border);border-radius:13px;color:var(--muted);font-size:13px;text-align:center}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--faint);line-height:1.5}

.setup{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px}
.setup h1{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em;margin:0 0 5px}
.setup p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.srow{margin-bottom:17px}
.slab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:0 0 8px}
.ninput{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-family:var(--f-body);font-size:16px;padding:0 14px;outline:none}
.ninput:focus{border-color:var(--gold)}
.epick{display:flex;gap:6px;flex-wrap:wrap}
.eb{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);font-size:20px;cursor:pointer;display:grid;place-items:center}
.eb.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cpick{display:flex;gap:8px}
.cb{width:40px;height:40px;border-radius:11px;cursor:pointer;border:2px solid transparent;background:var(--cv);display:grid;place-items:center}
.cb.on{border-color:var(--fg)}
.cb svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.cb.on svg{opacity:1}
.pbtn{width:100%;height:50px;margin-top:4px;border:0;border-radius:13px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:15px;color:#1b1407;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 78%,#000));box-shadow:var(--shadow)}
.pbtn:active{transform:translateY(1px)}
.pbtn:disabled{opacity:.5}

.tut{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,9,18,.55);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.tut-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:22px 20px 18px;animation:tpop .25s cubic-bezier(.2,1,.4,1)}
@keyframes tpop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.tut-ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:var(--gold-bg);border:1px solid var(--gold-line);margin-bottom:14px}
.tut-card h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0 0 7px}
.tut-card p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.tut-dots{display:flex;gap:6px;justify-content:center;margin:20px 0 16px}
.tut-dots i{width:7px;height:7px;border-radius:99px;background:var(--border)}
.tut-dots i.on{background:var(--gold);width:20px}
.tut-btns{display:flex;gap:8px}

<body>
<canvas id="fxcanvas"></canvas>
<div class="wrap">
  <header>
    <div class="header-in">
      <div class="brand"><div class="brand-mark">⚔️</div><div class="brand-name">Leben als RPG</div></div>
      <div class="hbtns">
        <button class="ibtn" id="helpBtn" hidden aria-label="Tutorial">?</button>
        <button class="ibtn" id="manageBtn" hidden>Bearbeiten</button>
        <button class="ibtn" id="themeBtn" aria-label="Design wechseln">◐</button>
      </div>
    </div>
  </header>
  <main id="app"></main>
</div>
<input type="file" id="impFile" accept="application/json,.json" hidden>
<div id="tutRoot"></div>

<script>
"use strict";
/* ============================================================================
   LEBEN ALS RPG — eigenständige Web-App (eine einzige HTML-Datei)
   ----------------------------------------------------------------------------
   ÜBERBLICK
   - Alles steckt in dieser einen Datei: HTML (oben), CSS (im <style>), Logik (hier).
   - Kein Server, kein Login, kein Internet nötig. Speicherung lokal im Browser
     über localStorage (Schlüssel LS_KEY). Jedes Gerät hat seinen eigenen Stand.
   - Hosten: Datei als index.html z. B. auf GitHub Pages / Netlify legen.
     Updaten = neue Datei hochladen. Solange die Internet-Adresse gleich bleibt,
     bleibt der Spielstand erhalten (localStorage hängt an der Adresse).

   AUFBAU DES CODES (von oben nach unten)
   1. KONFIGURATION: STATS, STAT_ORDER, RANK_LV, CAT_XP, Emoji-/Farblisten, TUTORIAL.
      -> Hier stellst du Werte/Inhalte ein, ohne die Logik anzufassen.
   2. HILFSFUNKTIONEN: Datum (dkey/mondayOf/addDays/fmtDate), Level-Mathe (levelInfo),
      Ränge (rankTitle), XP (autoXp/penaltyXp/isOverdue).
   3. ZUSTAND: D = gespeicherte Daten, S = reiner UI-Zustand, form = Formular-Eingaben.
   4. SPEICHERN: load()/save() lesen/schreiben localStorage.
   5. ABLEITUNGEN: totals() rechnet aus den Daten Level & XP je Skill.
   6. AKTIONEN: toggle()/addQuest()/delQuest() + Backup export/import.
   7. ANZEIGE: render() baut die Oberfläche als HTML-String und hängt Klicks via bind().
   8. ONBOARDING + TUTORIAL.

   DATENMODELL (D, wird als JSON gespeichert)
   - D.hero   = {name, emoji, color, gender:"m"|"f", created}
   - D.quests = Liste von Quests:
       {id, name, emoji, stat, period:"day"|"week"|"once", target, order, done,
        due?  (nur bei "once": Fälligkeitsdatum "YYYY-MM-DD"), doneDate?}
   - D.entries = { "YYYY-MM-DD": {date, done:{questId:1,...}} }
       -> Pro Tag ein Eintrag, welche täglichen/wöchentlichen Quests erledigt waren.
       -> Einmalige Quests (once) werden NICHT hier, sondern direkt an der Quest
          über q.done gespeichert (sie sind ja nicht an einen Wochentag gebunden).

   XP & LEVEL
   - XP pro Erledigung kommt NUR aus der Kategorie (CAT_XP), nie manuell gesetzt.
   - autoXp(): once gibt doppelte XP. penaltyXp(): Abzug bei verpasstem To-Do.
   - isOverdue(): true, wenn ein To-Do sein Datum überschritten und nicht erledigt ist.
     In totals() wird dann penaltyXp abgezogen. levelInfo() fängt Minus bei 0 ab.
   - levelInfo(xp, base): rechnet aus Gesamt-XP das Level. Kosten Level L->L+1 = base*L.
     Hero-Level nutzt base 150, einzelne Skills base 90.

   SO ÄNDERST DU TYPISCHE DINGE
   - XP-Werte je Kategorie:            CAT_XP (Zeile ~ "const CAT_XP").
   - Wann Ränge freigeschaltet werden: RANK_LV.
   - Rang-Namen (m/f):                 STATS[...].ranks.
   - Schneller/langsamer leveln:       die base-Zahlen in levelInfo-Aufrufen (150 / 90).
   - Tutorial-Texte:                   TUTORIAL.
   - Design/Farben:                    der :root-Block ganz oben im <style>.
   ========================================================================== */

// --- 1. KONFIGURATION ---
// Die fünf Skills/Kategorien. ico = Emoji in der App, css = Farb-Variable aus dem
// <style>, ranks = Titel je Level-Stufe, getrennt nach männlich (m) / weiblich (f).
const STATS = {
  koerper:{name:"Körper", ico:"💪", css:"--st-koerper", emoji:"🏋️", ranks:{m:["Novize","Athlet","Krieger","Champion","Titan"], f:["Novizin","Athletin","Kriegerin","Championesse","Titanin"]}},
  geist:{name:"Geist", ico:"🧠", css:"--st-geist", emoji:"🧘", ranks:{m:["Träumer","Grübler","Denker","Weiser","Erleuchteter"], f:["Träumerin","Grüblerin","Denkerin","Weise","Erleuchtete"]}},
  kreativ:{name:"Kreativ", ico:"🎨", css:"--st-kreativ", emoji:"🎮", ranks:{m:["Bastler","Macher","Künstler","Visionär","Meister"], f:["Bastlerin","Macherin","Künstlerin","Visionärin","Meisterin"]}},
  alltag:{name:"Alltag", ico:"🏠", css:"--st-alltag", emoji:"🧹", ranks:{m:["Helfer","Verwalter","Haushüter","Burgherr","Haus-Gott"], f:["Helferin","Verwalterin","Haushüterin","Burgherrin","Haus-Göttin"]}},
  beziehung:{name:"Bindung", ico:"❤️", css:"--st-beziehung", emoji:"🫶", ranks:{m:["Begleiter","Vertrauter","Herzensritter","Seelenpaar","Legende"], f:["Begleiterin","Vertraute","Herzensritterin","Seelenpaar","Legende"]}},
};
const STAT_ORDER = ["koerper","geist","kreativ","alltag","beziehung"]; // Reihenfolge in der Anzeige
const RANK_LV = [1,3,6,10,15];   // Bei diesen Leveln wird je Skill der nächste Rang (Titel) freigeschaltet
const CAT_XP  = {koerper:25, geist:15, kreativ:20, alltag:15, beziehung:30}; // XP pro Erledigung je Kategorie
// XP für eine Erledigung. Einmalige Quests (once) geben doppelte XP.
function autoXp(stat, period){ const b=CAT_XP[stat]||15; return period==="once" ? b*2 : b; }
// Strafe für eine verpasste (überfällige, nicht erledigte) einmalige Quest
function penaltyXp(stat){ return CAT_XP[stat]||15; }
// true, wenn eine einmalige Quest ihr Fälligkeitsdatum überschritten und nicht erledigt ist
function isOverdue(q, today){ return q.period==="once" && !q.done && q.due && dkey(today) > q.due; }

const HERO_EMOJIS = ["⚔️","🛡️","🌸","🦊","🐉","🎧","🌿","⭐","🐱","🔮","🧝","🏹"]; // Auswahl beim Helden-Erstellen
const HERO_COLORS = ["--st-kreativ","--st-beziehung","--st-geist","--st-koerper","--st-alltag"]; // Farb-Auswahl (Variablen aus dem <style>)
const QEMOJIS = ["⚔️","🏋️","🍳","🧹","🧺","🐱","🎮","🎨","📚","🎸","🧘","🚿","💊","🚶","💧","📝","☎️","🛒","🌙","🏃"]; // Auswahl beim Quest-Erstellen
const PERIOD_LABEL = {day:"Täglich", week:"Wöchentlich", once:"Einmalig"}; // Beschriftung der Quest-Arten
// Die vier Tutorial-Schritte (erscheinen nach dem Helden-Erstellen, erneut über "?").
const TUTORIAL = [
  {ico:"⚔️", h:"Willkommen, Held!", p:"Dein Leben als Rollenspiel: Alltag, Sport, kreative Arbeit und Zeit für andere werden zu Quests, die dich leveln lassen. Hier die wichtigsten Dinge in 4 kurzen Schritten."},
  {ico:"✅", h:"Quests erledigen", p:"Tippe eine Quest an, um sie zu erledigen — es gibt Konfetti und XP. Tägliche Quests zählen jeden Tag neu, wöchentliche über die ganze Woche, einmalige To-Dos verschwinden nach dem Abhaken."},
  {ico:"✏️", h:"Eigene Quests anlegen", p:"Oben rechts auf „Bearbeiten“ tippen, dann „Neue Quest“. Du wählst Art, Name und Kategorie. Wie viele XP es gibt, rechnet die App automatisch nach Kategorie — das stellst du nie selbst ein."},
  {ico:"🧠", h:"Skills & Skilltree", p:"Jede Quest füttert einen von fünf Skills: Körper, Geist, Kreativ, Alltag, Bindung. Im Tab „Skilltree“ steigen deine Ränge. Dein Fortschritt wird direkt auf deinem Handy gespeichert."},
];

// --- 2. HILFSFUNKTIONEN ---
// dkey: Datum -> "YYYY-MM-DD" (der Schlüssel, unter dem ein Tag in D.entries steht).
const dkey = d => { const z=new Date(d); z.setHours(0,0,0,0);
  return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); };
function mondayOf(d){ const z=new Date(d); z.setHours(0,0,0,0); const w=(z.getDay()+6)%7; z.setDate(z.getDate()-w); return z; } // Montag der Woche
function addDays(d,n){ const z=new Date(d); z.setDate(z.getDate()+n); return z; } // Datum +/- n Tage
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"]; // Wochentag-Kürzel (Montag = Index 0)
// "2026-10-23" -> "23.10." (für die Anzeige des Fälligkeitsdatums)
function fmtDate(key){ const p=String(key).split("-"); return p.length===3 ? (+p[2])+"."+(+p[1])+"." : key; }
// Rechnet aus Gesamt-XP das Level. Kosten für Stufe L->L+1 = base*L (steigt also an).
// Rückgabe: lvl (aktuelles Level), into/span (XP im aktuellen Level / bis zum nächsten), pct (Balkenfüllung 0..1).
function levelInfo(xp, base){ xp=Math.max(0,xp); let lvl=1, need=base, acc=0;
  while(xp >= acc+need){ acc+=need; lvl++; need=base*lvl; }
  return {lvl, into:Math.round(xp-acc), span:need, pct:Math.max(0,Math.min(1,(xp-acc)/need))}; }
function ranksOf(stat,g){ const r=STATS[stat].ranks; return (g==="f"?r.f:r.m); } // Rang-Titel-Liste nach Geschlecht
function rankIdx(lv){ let idx=0; for(let i=0;i<RANK_LV.length;i++){ if(lv>=RANK_LV[i]) idx=i; } return idx; } // welcher Rang bei diesem Level
function rankTitle(stat,lv,g){ return ranksOf(stat,g)[rankIdx(lv)]; } // aktueller Titel (z. B. "Kriegerin")

// --- 3. ZUSTAND ---
const LS_KEY="leben-als-rpg";                               // Schlüssel in localStorage
let D = {hero:null, quests:[], entries:{}, tutDone:false};  // DIE gespeicherten Daten (siehe Datenmodell oben)
const S = {manage:false, adding:false, view:"quests", tut:-1}; // reiner UI-Zustand (wird nicht gespeichert)
const form = {name:"", emoji:"", stat:"alltag", period:"day", target:2, due:""}; // Zwischenspeicher des Quest-Formulars

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c])); } // HTML sicher einsetzen
function qmap(){ const m={}; D.quests.forEach(q=>m[q.id]=q); return m; } // Quests nach id nachschlagbar machen
function uid(){ return "q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); } // eindeutige Quest-ID erzeugen

// --- 4. SPEICHERN ---
// load() beim Start aus localStorage lesen, save() nach jeder Änderung schreiben.
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw);
    D.hero=o.hero||null; D.quests=Array.isArray(o.quests)?o.quests:[]; D.entries=o.entries||{}; D.tutDone=!!o.tutDone; } }catch(e){}
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){} }

function lsTheme(v){ try{ if(v===undefined) return localStorage.getItem(LS_KEY+"-theme"); localStorage.setItem(LS_KEY+"-theme",v); }catch(e){ return null; } } // Hell/Dunkel merken
// Kopfzeilen-Knöpfe verdrahten (einmalig beim Laden): Theme, Bearbeiten, Tutorial, Datei-Import.
(function(){
  const saved=lsTheme();
  if(saved==="dark"||saved==="light") document.documentElement.setAttribute("data-theme",saved);
  document.getElementById("themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const isDark = cur==="dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
    const next=isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); lsTheme(next);
  });
  document.getElementById("manageBtn").addEventListener("click",()=>{ S.manage=!S.manage; if(!S.manage) S.adding=false; if(S.manage) S.view="quests"; render(); });
  document.getElementById("helpBtn").addEventListener("click",()=>{ S.tut=0; renderTut(); });
  document.getElementById("impFile").addEventListener("change",importFile);
})();

/* ---------- 5. ABLEITUNGEN (aus den Daten gerechnet, nichts gespeichert) ---------- */
function doneOn(qid,key){ const e=D.entries[key]; return !!(e&&e.done&&e.done[qid]); } // war Quest an Tag "key" erledigt?
// totals(): summiert XP je Skill und gesamt. Tägliche/wöchentliche aus D.entries,
// einmalige aus q.done (+XP) bzw. überfällig & offen (−penaltyXp). Basis fürs Level.
function totals(){
  const m=qmap(); const today=new Date(); const stat={}; STAT_ORDER.forEach(k=>stat[k]=0); let total=0;
  for(const key in D.entries){ const done=D.entries[key].done||{};
    for(const qid in done){ const q=m[qid]; if(done[qid]&&q&&q.period!=="once"){ const xp=autoXp(q.stat,q.period); stat[q.stat]=(stat[q.stat]||0)+xp; total+=xp; } } }
  D.quests.forEach(q=>{
    if(q.period!=="once") return;
    if(q.done){ const xp=autoXp(q.stat,"once"); stat[q.stat]=(stat[q.stat]||0)+xp; total+=xp; }
    else if(isOverdue(q,today)){ const p=penaltyXp(q.stat); stat[q.stat]=(stat[q.stat]||0)-p; total-=p; }
  });
  return {stat,total};
}
function weekCount(qid,anchor){ const mon=mondayOf(anchor); let c=0; // wie oft diese Woche erledigt
  for(let i=0;i<7;i++){ if(doneOn(qid,dkey(addDays(mon,i)))) c++; } return c; }
function dayStreak(qid,today){ let c=0; let start=doneOn(qid,dkey(today))?0:1; // Serie aufeinanderfolgender Tage
  for(let i=start;i<400;i++){ if(doneOn(qid,dkey(addDays(today,-i)))) c++; else break; } return c; }
function weekStreak(qid,target,today){ let c=0; let wk=mondayOf(today); // Serie erfüllter Wochen (target erreicht)
  if(weekCount(qid,wk)<target) wk=addDays(wk,-7);
  for(let i=0;i<200;i++){ if(weekCount(qid,wk)>=target){ c++; wk=addDays(wk,-7);} else break; } return c; }

/* ---------- 6. AKTIONEN (ändern D, speichern, neu zeichnen) ---------- */
// Quest an-/abhaken. once: schaltet q.done um. day/week: setzt Haken im heutigen D.entries-Eintrag.
function toggle(q){
  if(S.manage) return; // im Bearbeiten-Modus wird nicht abgehakt, sondern gelöscht
  if(q.period==="once"){ q.done=!q.done; q.doneDate=q.done?dkey(new Date()):null; if(q.done) celebrate(q); save(); render(); return; }
  const key=dkey(new Date()); const cur=D.entries[key]||{date:key,done:{}}; const done=Object.assign({},cur.done);
  const nowOn=!done[q.id]; if(nowOn) done[q.id]=1; else delete done[q.id];
  D.entries[key]={date:key,done}; if(nowOn) celebrate(q); save(); render();
}
// Neue Quest aus dem Formular (form) anlegen. Bei "once" ist ein Fälligkeitsdatum Pflicht.
function addQuest(){
  const name=form.name.trim(); if(!name) return;
  if(form.period==="once" && !form.due) return; // Datum bei To-Dos Pflicht
  const maxOrder=D.quests.reduce((m,q)=>Math.max(m,q.order||0),0);
  const q={id:uid(), name, emoji:form.emoji||STATS[form.stat].emoji, stat:form.stat, period:form.period,
    target:form.period==="week"?Math.max(1,Math.min(7,form.target)):1, order:maxOrder+1, done:false};
  if(form.period==="once") q.due=form.due;
  D.quests.push(q);
  S.adding=false; form.name=""; form.emoji=""; form.due=""; save(); render();
}
function delQuest(qid){ D.quests=D.quests.filter(q=>q.id!==qid); save(); render(); } // Quest löschen

/* ---------- BACKUP: Spielstand als Datei sichern / laden ---------- */
// exportData: lädt D als JSON-Datei herunter. importFile: liest so eine Datei zurück in D.
function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="leben-als-rpg-sicherung.json"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },800);
}
function importFile(ev){
  const f=ev.target.files&&ev.target.files[0]; ev.target.value=""; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
    if(o&&typeof o==="object"){ D.hero=o.hero||null; D.quests=Array.isArray(o.quests)?o.quests:[]; D.entries=o.entries||{}; D.tutDone=!!o.tutDone; save(); S.manage=false; render(); } }
    catch(e){ alert("Die Datei konnte nicht gelesen werden. Bitte wähle eine Sicherungs-Datei dieser App."); } };
  r.readAsText(f);
}

/* ---------- KONFETTI (eigene kleine Umsetzung auf einem Canvas, ohne Bibliothek) ---------- */
// celebrate() wird beim Erledigen gerufen; initFx/tick betreiben die Animation.
let fx=null;
function initFx(){ const c=document.getElementById("fxcanvas"); const ctx=c.getContext("2d");
  function size(){ c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; }
  size(); addEventListener("resize",size); fx={c,ctx,parts:[]};
  requestAnimationFrame(tick); }
function tick(){ if(!fx) return; const {c,ctx,parts}=fx; ctx.clearRect(0,0,c.width,c.height);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vy+=0.28*devicePixelRatio; p.x+=p.vx; p.y+=p.vy; p.a-=0.016; p.rot+=p.vr;
    if(p.a<=0||p.y>c.height+40){ parts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); }
  requestAnimationFrame(tick); }
function celebrate(q){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  if(!fx) initFx();
  const col=getComputedStyle(document.documentElement).getPropertyValue(q?STATS[q.stat].css:"--gold").trim()||"#f0b43f";
  const gold=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#f0b43f";
  const cols=[col,gold,"#ffffff"]; const cx=fx.c.width*0.5; const cy=fx.c.height*0.62;
  for(let i=0;i<34;i++){ const ang=Math.PI*2*Math.random(); const sp=(4+Math.random()*7)*devicePixelRatio;
    fx.parts.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-5*devicePixelRatio,
      a:1,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,s:(6+Math.random()*5)*devicePixelRatio,col:cols[i%cols.length]}); }
}

/* ---------- 7. ANZEIGE ---------- */
// render() ist die zentrale Zeichenfunktion: baut die ganze Oberfläche als HTML-String
// und schreibt sie in #app. Nach jeder Änderung von D oder S wird render() gerufen.
// Ohne Helden -> Onboarding. Sonst: Heldenkarte + Tabs (Quests/Skilltree) + Inhalt.
function render(){
  const app=document.getElementById("app"); const mBtn=document.getElementById("manageBtn"); const hBtn=document.getElementById("helpBtn");
  if(!D.hero){ mBtn.hidden=true; hBtn.hidden=true; renderSetup(app); renderTut(); return; } // noch kein Held -> Erstellen
  hBtn.hidden=false; mBtn.hidden=false; mBtn.textContent=S.manage?"Fertig":"Bearbeiten"; mBtn.classList.toggle("on",S.manage);

  const today=new Date(); const tkey=dkey(today);
  const T=totals(); const L=levelInfo(T.total,150); const pc=esc(D.hero.color||"--gold");
  let topStat="alltag",topVal=-1; STAT_ORDER.forEach(k=>{if((T.stat[k]||0)>topVal){topVal=T.stat[k];topStat=k;}});
  const epithet=topVal>0?rankTitle(topStat,levelInfo(T.stat[topStat],90).lvl,D.hero.gender):"Frischling";

  let html=`<section class="hero" style="--pc:var(${pc})">
    <div class="hero-top"><div class="hero-ava">${esc(D.hero.emoji||"⭐")}</div>
      <div class="hero-id"><div class="hero-name">${esc(D.hero.name||"Held")}</div>
        <div class="hero-epithet">Stufe ${L.lvl} · ${esc(epithet)}</div></div>
      <div class="hero-lvl"><b>${L.lvl}</b><span>Level</span></div></div>
    <div class="xpbar"><div class="xpbar-row"><span class="lab">Gesamt-XP</span>
      <span class="val">${L.into} / ${L.span} → LVL ${L.lvl+1}</span></div>
      <div class="track"><div class="fill" style="width:${(L.pct*100).toFixed(1)}%"></div></div></div>
    <div class="stats">`;
  STAT_ORDER.forEach(k=>{ const sl=levelInfo(T.stat[k]||0,90); const sc=esc(STATS[k].css);
    html+=`<div class="stat" style="--sc:var(${sc})"><div class="stat-ico">${STATS[k].ico}</div>
      <div class="stat-lv">${sl.lvl}</div><div class="stat-nm">${STATS[k].name}</div>
      <div class="stat-mini"><i style="width:${(sl.pct*100).toFixed(0)}%"></i></div></div>`; });
  html+='</section>';

  if(!S.manage){
    html+=`<div class="vswitch">
      <button class="${S.view==="quests"?"on":""}" data-view="quests">Quests</button>
      <button class="${S.view==="tree"?"on":""}" data-view="tree">Skilltree</button></div>`;
  }
  if(!S.manage && S.view==="tree") html+=renderTree(T,D.hero.gender);
  else html+=renderQuests(today,tkey,pc);

  app.innerHTML=html; bind(app); renderTut();
}

// Baut die drei Quest-Listen (Heute / Diese Woche / To-Do einmalig). Im Bearbeiten-Modus
// zusätzlich der "+ Neue Quest"-Knopf und die Backup-Knöpfe; sonst die Wochenleiste.
function renderQuests(today,tkey,pc){
  const dayQ=D.quests.filter(q=>q.period==="day");
  const weekQ=D.quests.filter(q=>q.period==="week");
  const onceQ=D.quests.filter(q=>q.period==="once");
  let html="";

  const dDone=dayQ.filter(q=>doneOn(q.id,tkey)).length;
  html+=`<section class="sec"><div class="sec-h"><h2>Heute · ${WD[(today.getDay()+6)%7]}. ${today.getDate()}.${today.getMonth()+1}.</h2>
    <span class="sub">${dDone}/${dayQ.length}</span></div><div class="quests">`;
  if(dayQ.length===0) html+='<div class="empty">Keine täglichen Quests.</div>';
  dayQ.forEach(q=>html+=questRow(q,tkey,today));
  html+='</div></section>';

  const metW=weekQ.filter(q=>weekCount(q.id,today)>=q.target).length;
  html+=`<section class="sec"><div class="sec-h"><h2>Diese Woche</h2><span class="sub">${metW}/${weekQ.length} Ziele</span></div><div class="quests">`;
  if(weekQ.length===0) html+='<div class="empty">Keine wöchentlichen Quests.</div>';
  weekQ.forEach(q=>html+=questRow(q,tkey,today));
  html+='</div></section>';

  const openOnce=onceQ.filter(q=>!q.done); const doneOnce=onceQ.filter(q=>q.done);
  html+=`<section class="sec"><div class="sec-h"><h2>To-Do · Einmalig</h2><span class="sub">${openOnce.length} offen</span></div><div class="quests">`;
  if(openOnce.length===0 && !(S.manage&&doneOnce.length)) html+='<div class="empty">Keine einmaligen Aufgaben. Leg im Bearbeiten-Modus welche an.</div>';
  openOnce.forEach(q=>html+=questRow(q,tkey,today));
  if(S.manage) doneOnce.forEach(q=>html+=questRow(q,tkey,today,true));
  html+='</div></section>';

  if(S.manage){
    if(S.adding) html+=addForm();
    else html+='<button class="addbtn" data-add="1">+ Neue Quest anlegen</button>';
    html+=`<div class="tools">
      <button class="tbtn" data-export="1"><span class="ti">💾</span><span>Sicherung exportieren<small>Spielstand als Datei speichern</small></span></button>
      <button class="tbtn" data-import="1"><span class="ti">📂</span><span>Sicherung laden<small>Spielstand aus Datei wiederherstellen</small></span></button>
    </div>`;
  } else {
    const mon=mondayOf(today);
    html+='<div class="weekwrap"><div class="weekdays">';
    for(let i=0;i<7;i++){ const d=addDays(mon,i); const k=dkey(d);
      const any=D.quests.some(q=>q.period!=="once"&&doneOn(q.id,k)); const isT=k===tkey;
      html+=`<div class="wd ${any?"hit":""} ${isT?"today":""}" style="--pc:var(${pc})">
        <div class="wd-l">${WD[i]}</div><div class="wd-n">${d.getDate()}</div><div class="wd-dot"></div></div>`; }
    html+='</div></div>';
  }
  html+=S.manage
    ? '<div class="foot">XP werden automatisch nach Kategorie vergeben — du stellst sie nie selbst ein.<br>Tippe „Fertig“, um wieder abzuhaken.</div>'
    : '<div class="foot">Tippe eine Quest an, um sie zu erledigen.<br>Jede Kategorie füttert ihren eigenen Skill.</div>';
  return html;
}

// Eine einzelne Quest-Zeile als HTML. Zeigt je nach Art Streak/Wochenziel/Fälligkeit und
// rechts den Abhak-Knopf (bzw. Lösch-Knopf im Bearbeiten-Modus). "over" = verpasstes To-Do.
function questRow(q,tkey,today,archived){
  const sc=esc(STATS[q.stat].css); const xp=autoXp(q.stat,q.period);
  let done=false, meta="";
  if(q.period==="day"){ done=doneOn(q.id,tkey); const streak=dayStreak(q.id,today);
    meta = streak>0?`<span class="streak">🔥 ${streak} Tag${streak>1?"e":""}</span>`:`<span>täglich</span>`; }
  else if(q.period==="week"){ done=doneOn(q.id,tkey);
    const wc=weekCount(q.id,today); const met=wc>=q.target; const ws=weekStreak(q.id,q.target,today);
    meta=`<span class="pill goal ${met?"met":""}">${wc}/${q.target} Woche${met?" ✓":""}</span>`+(ws>0?`<span class="streak">🔥 ${ws} Wo.</span>`:""); }
  else { done=!!q.done; const over=isOverdue(q,today);
    let statusTxt = done ? "✓ erledigt" : over ? `⚠️ verpasst · −${penaltyXp(q.stat)} XP` : (q.due?`bis ${fmtDate(q.due)}`:"einmalig");
    meta=`<span class="pill cat" style="--sc:var(${sc})">${STATS[q.stat].ico} ${STATS[q.stat].name}</span><span>${statusTxt}</span>`; }
  const over = isOverdue(q,today);
  const right = S.manage
    ? `<button class="del" data-del="${esc(q.id)}" aria-label="Quest löschen">🗑</button>`
    : `<button class="check" data-q="${esc(q.id)}" aria-label="${esc(q.name)} erledigen"><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></span></button>`;
  const cls=(done&&!S.manage?"done ":"")+(S.manage?"editing ":"")+(archived?"archived ":"")+(over&&!S.manage?"over ":"");
  return `<div class="q ${cls}" style="--sc:var(${sc})">
    <div class="q-ico">${esc(q.emoji||STATS[q.stat].emoji)}</div>
    <div class="q-body"><div class="q-name">${esc(q.name)}</div>
      <div class="q-meta">${meta}<span class="pill xp">+${xp} XP</span></div></div>
    ${right}</div>`;
}

// Skilltree-Ansicht: je Kategorie ein Ast mit Level, aktuellem Rang und den 5 Rang-Knoten.
// Die Klasse g-m/g-f steuert im CSS die eckige (m) bzw. runde (f) Knotenform.
function renderTree(T,g){
  let html='<div class="tree g-'+(g==="f"?"f":"m")+'">';
  STAT_ORDER.forEach(k=>{ const sc=esc(STATS[k].css); const xp=T.stat[k]||0; const L=levelInfo(xp,90);
    const arr=ranksOf(k,g); const ci=rankIdx(L.lvl); const cur=arr[ci];
    let nextTitle=null,nextLv=null;
    for(let i=0;i<RANK_LV.length;i++){ if(L.lvl<RANK_LV[i]){ nextTitle=arr[i]; nextLv=RANK_LV[i]; break; } }
    html+=`<div class="branch" style="--sc:var(${sc})">
      <div class="br-head"><div class="br-ico">${STATS[k].ico}</div>
        <div class="br-id"><div class="br-name">${STATS[k].name}</div><div class="br-rank">${esc(cur)}</div></div>
        <div class="br-lv">${L.lvl}</div></div>
      <div class="br-track"><i style="width:${(L.pct*100).toFixed(0)}%"></i></div>
      <div class="br-xp">${L.into}/${L.span} XP${nextTitle?` · nächster Rang: ${esc(nextTitle)} (Lvl ${nextLv})`:" · Maximaler Rang"}</div>
      <div class="nodes">`;
    RANK_LV.forEach((rl,i)=>{ const on=L.lvl>=rl; const isCur=i===ci;
      html+=`<div class="nodewrap ${on?"on":""} ${isCur?"cur":""}"><div class="node">${on?"★":rl}</div><div class="node-t">${esc(arr[i])}</div></div>`; });
    html+='</div></div>';
  });
  html+='</div><div class="foot">Jede erledigte Quest bringt XP in ihre Kategorie.<br>Neues Level = nächster Rang freigeschaltet.</div>';
  return html;
}

// Das Formular zum Anlegen einer Quest (Art, Name, Kategorie, ggf. Wochenziel/Fälligkeit, Symbol).
// Liest/schreibt das form-Objekt; bei "once" erscheint das Pflicht-Datumsfeld und der Penalty-Hinweis.
function addForm(){
  const xp=autoXp(form.stat,form.period);
  const types=["day","week","once"].map(t=>`<button class="${form.period===t?"on":""}" data-type="${t}">${PERIOD_LABEL[t]}</button>`).join("");
  const cats=STAT_ORDER.map(k=>`<button class="chip ${form.stat===k?"on":""}" style="--cc:var(${STATS[k].css})" data-cat="${k}">${STATS[k].ico} ${STATS[k].name}</button>`).join("");
  const emos=QEMOJIS.map(e=>`<button class="eb ${form.emoji===e?"on":""}" data-emo="${e}">${e}</button>`).join("");
  const freq = form.period==="week"
    ? `<div class="frow"><div class="flab">Wie oft pro Woche</div>
        <div class="estep"><button data-step="-1">−</button><span>${form.target}× / Woche</span><button data-step="1">+</button></div></div>` : "";
  const dueBlock = form.period==="once"
    ? `<div class="frow"><div class="flab">Bis wann erledigen</div>
        <input class="finput" id="qdue" type="date" value="${esc(form.due)}"></div>` : "";
  const p = penaltyXp(form.stat);
  const xpLine = form.period==="week" ? `✨ Automatisch: +${xp} XP pro Mal · ~${xp*form.target} XP/Woche`
    : form.period==="once" ? `✨ +${xp} XP wenn erledigt · ⚠️ −${p} XP, wenn der Tag ohne Erledigung vergeht`
    : `✨ Automatisch: +${xp} XP pro Tag`;
  const canSave = form.name.trim() && (form.period!=="once" || form.due);
  return `<div class="form"><h3>Neue Quest</h3>
    <div class="frow"><div class="flab">Art</div><div class="seg">${types}</div></div>
    <div class="frow"><div class="flab">Name</div>
      <input class="finput" id="qname" value="${esc(form.name)}" placeholder="z. B. Keller aufräumen" maxlength="40"></div>
    <div class="frow"><div class="flab">Kategorie (welcher Skill steigt)</div><div class="chips">${cats}</div></div>
    ${freq}${dueBlock}
    <div class="frow"><div class="flab">Symbol (optional)</div><div class="epick">${emos}</div></div>
    <div class="xphint">${xpLine}</div>
    <div class="fbtns"><button class="fbtn cancel" id="fcancel">Abbrechen</button>
      <button class="fbtn save" id="fsave" ${canSave?"":"disabled"}>Quest anlegen</button></div></div>`;
}

// render() erzeugt nur HTML; bind() hängt danach die Klick-/Eingabe-Reaktionen an die
// Elemente (erkennbar an data-...-Attributen). Muss nach jedem render() laufen.
function bind(app){
  app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ S.view=b.getAttribute("data-view"); render(); });
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ const q=qmap()[b.getAttribute("data-q")]; if(q) toggle(q); });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delQuest(b.getAttribute("data-del")));
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ S.adding=true; render(); const n=document.getElementById("qname"); if(n) n.focus(); });
  app.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{ form.period=b.getAttribute("data-type");
    if(form.period==="once" && !form.due) form.due=dkey(new Date()); // To-Do: Fälligkeit standardmäßig heute
    render(); });
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ form.stat=b.getAttribute("data-cat"); render(); });
  app.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{ const e=b.getAttribute("data-emo"); form.emoji=form.emoji===e?"":e; render(); });
  app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{ form.target=Math.max(1,Math.min(7,form.target+ +b.getAttribute("data-step"))); render(); });
  app.querySelectorAll("[data-export]").forEach(b=>b.onclick=exportData);
  app.querySelectorAll("[data-import]").forEach(b=>b.onclick=()=>document.getElementById("impFile").click());
  const nm=document.getElementById("qname"); if(nm) nm.oninput=()=>{ form.name=nm.value;
    const sv=document.getElementById("fsave"); if(sv) sv.disabled=!(nm.value.trim() && (form.period!=="once"||form.due)); };
  const du=document.getElementById("qdue"); if(du) du.onchange=()=>{ form.due=du.value;
    const sv=document.getElementById("fsave"); if(sv) sv.disabled=!(form.name.trim() && form.due); };
  const sv=document.getElementById("fsave"); if(sv) sv.onclick=addQuest;
  const cn=document.getElementById("fcancel"); if(cn) cn.onclick=()=>{ S.adding=false; form.name=""; form.emoji=""; render(); };
}

// Tutorial-Overlay. S.tut = aktueller Schritt (-1 = aus). Wird nach dem Erstellen automatisch
// gestartet (wenn D.tutDone falsch) und über den "?"-Knopf erneut aufrufbar.
function renderTut(){
  const root=document.getElementById("tutRoot");
  if(S.tut<0 || S.tut>=TUTORIAL.length){ root.innerHTML=""; return; }
  const t=TUTORIAL[S.tut]; const last=S.tut===TUTORIAL.length-1;
  const dots=TUTORIAL.map((_,i)=>`<i class="${i===S.tut?"on":""}"></i>`).join("");
  root.innerHTML=`<div class="tut"><div class="tut-card">
    <div class="tut-ico">${t.ico}</div><h2>${esc(t.h)}</h2><p>${esc(t.p)}</p>
    <div class="tut-dots">${dots}</div>
    <div class="tut-btns">
      <button class="tut-skip" id="tutSkip" ${last?'style="display:none"':''}>Überspringen</button>
      <button class="tut-next" id="tutNext">${last?"Los geht's":"Weiter"}</button>
    </div></div></div>`;
  const close=()=>{ S.tut=-1; D.tutDone=true; save(); renderTut(); };
  root.querySelector("#tutSkip").onclick=close;
  root.querySelector("#tutNext").onclick=()=>{ if(last) close(); else { S.tut++; renderTut(); } };
}

/* ---------- 8. ONBOARDING (Helden-Erstellung beim ersten Start) ---------- */
// setupState hält die Eingaben, bis auf "Abenteuer starten" gedrückt wird; dann wird
// D.hero gesetzt, gespeichert und (falls noch nicht gesehen) das Tutorial gestartet.
let setupState=null;
function renderSetup(app){
  if(!setupState) setupState={name:"", emoji:"⚔️", color:"--st-kreativ", gender:"m"};
  const emos=HERO_EMOJIS.map(e=>`<button class="eb ${setupState.emoji===e?"on":""}" data-e="${e}">${e}</button>`).join("");
  const cols=HERO_COLORS.map(c=>`<button class="cb ${setupState.color===c?"on":""}" style="--cv:var(${c})" data-c="${c}"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></button>`).join("");
  app.innerHTML=`<div class="setup"><h1>Deinen Helden erstellen</h1>
    <p>Dein eigener Charakter mit eigenen Leveln und Quests. Alles wird direkt auf diesem Gerät gespeichert.</p>
    <div class="srow"><div class="slab">Name</div><input class="ninput" id="hname" value="${esc(setupState.name)}" placeholder="Dein Heldenname" maxlength="18"></div>
    <div class="srow"><div class="slab">Charakter</div><div class="seg" style="max-width:280px">
      <button class="${setupState.gender==='m'?'on':''}" data-g="m">♂ Männlich</button>
      <button class="${setupState.gender==='f'?'on':''}" data-g="f">♀ Weiblich</button></div></div>
    <div class="srow"><div class="slab">Symbol</div><div class="epick">${emos}</div></div>
    <div class="srow"><div class="slab">Farbe</div><div class="cpick">${cols}</div></div>
    <button class="pbtn" id="startBtn" ${setupState.name.trim()?"":"disabled"}>Abenteuer starten</button></div>`;
  const nm=app.querySelector("#hname"); nm.oninput=()=>{ setupState.name=nm.value; app.querySelector("#startBtn").disabled=!nm.value.trim(); };
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ setupState.emoji=b.getAttribute("data-e"); renderSetup(app); });
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ setupState.color=b.getAttribute("data-c"); renderSetup(app); });
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ setupState.gender=b.getAttribute("data-g"); renderSetup(app); });
  app.querySelector("#startBtn").onclick=()=>{
    const name=setupState.name.trim(); if(!name) return;
    D.hero={name, emoji:setupState.emoji, color:setupState.color, gender:setupState.gender, created:dkey(new Date())};
    if(!D.tutDone) S.tut=0;
    save(); render();
  };
}

load();
render();
